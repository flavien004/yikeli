# ============================================================
# YIKÉLI — Configuration Netlify
# Les variables d'environnement (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# JWT_SECRET…) se définissent dans : Site settings → Environment variables.
# Ne JAMAIS les préfixer par VITE_ (elles seraient publiées dans le navigateur).
# ============================================================
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888

# Fallback SPA (les routes /api/* sont servies par la fonction `api`, cf. config.path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
